# On a version tag (v0.5.0), build cbar, switchboard and claude-relay for
# macOS and Linux and attach the binaries and their SHA256SUMS to the GitHub
# release, where ./install and cbar update download them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin, suffix: darwin-arm64 }
          - { runner: macos-15, target: x86_64-apple-darwin, suffix: darwin-x86_64 }
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, suffix: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, suffix: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: |
          mkdir dist
          for b in cbar switchboard claude-relay; do
            cp target/${{ matrix.target }}/release/$b dist/$b-${{ matrix.suffix }}
          done
      - uses: actions/upload-artifact@v4
        with:
          name: crossbar-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "cbar, switchboard and claude-relay for macOS and Linux. Install crossbar with ./install; it downloads the ones for your platform."
        env:
          GH_TOKEN: ${{ github.token }}
