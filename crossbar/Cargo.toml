[package]
name = "crossbar"
version = "0.5.2"
edition = "2021"
description = "cbar and switchboard: a team of Claude Code agents in Rex or tmux"
license = "MIT"

[[bin]]
name = "cbar"
path = "src/bin/cbar.rs"

[[bin]]
name = "switchboard"
path = "src/bin/switchboard.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
